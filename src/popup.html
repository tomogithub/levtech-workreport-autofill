<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>勤怠自動入力</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <h1>勤怠自動入力</h1>
          <p id="pageStatus">作業報告書を確認中...</p>
        </div>
      </header>

      <form id="settingsForm" class="form">
        <section class="timeGrid" aria-label="勤務時間">
          <label>
            <span>開始時間</span>
            <input id="startTime" type="text" inputmode="numeric" autocomplete="off" placeholder="10:00">
          </label>
          <label>
            <span>終了時間</span>
            <input id="endTime" type="text" inputmode="numeric" autocomplete="off" placeholder="19:00">
          </label>
          <label>
            <span>休憩時間</span>
            <input id="breakTime" type="text" inputmode="numeric" autocomplete="off" placeholder="01:00">
          </label>
        </section>

        <label class="contentField">
          <span>作業内容</span>
          <input id="workContent" type="text" autocomplete="off" placeholder="開発業務">
        </label>

        <section class="options" aria-label="入力オプション">
          <label class="checkRow">
            <input id="weekdaysOnly" type="checkbox">
            <span>土日を除外する</span>
          </label>
          <label class="checkRow">
            <input id="overwrite" type="checkbox">
            <span>入力済みの日も上書きする</span>
          </label>
        </section>

        <button id="applyButton" type="submit">この月に入力する</button>
      </form>

      <p id="result" class="result" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
